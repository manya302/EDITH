<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login · Student & Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/login.css">
</head>
<body>
  <main class="login-container">
    <a href="index.html" class="back-home" aria-label="Back to Home">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 12H5M12 19l-7-7 7-7"/>
      </svg>
      <span>Back to Home</span>
    </a>

    <div class="login-card">
      <div class="login-header">
        <h1 class="login-title" id="formTitle">Welcome back</h1>
        <p class="login-subtitle" id="formSubtitle">Sign in to your account</p>
      </div>

      <!-- Role selector -->
      <div class="role-selector" role="tablist" aria-label="Choose login role">
        <button class="role-btn active" data-role="student" role="tab" aria-selected="true">Student</button>
        <button class="role-btn" data-role="admin" role="tab" aria-selected="false">Admin</button>
      </div>

      <!-- Email step (shared) -->
      <form id="emailForm" class="login-form active" data-step="email">
        <div class="input-group">
          <label for="email">Email address</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required>
        </div>
        <button type="submit" class="login-btn" id="emailContinueBtn">Continue</button>
        <p class="form-hint">We'll check if you already have an account.</p>
      </form>

      <!-- Login form (existing user) -->
      <form id="loginForm" class="login-form" data-step="login">
        <div class="input-group">
          <label for="loginEmail">Email</label>
          <input type="email" id="loginEmail" name="loginEmail" placeholder="you@example.com" autocomplete="email" readonly>
        </div>
        <div class="input-group">
          <label for="loginPassword">Password</label>
          <input type="password" id="loginPassword" name="loginPassword" placeholder="Enter your password" autocomplete="current-password" required>
        </div>
        <button type="submit" class="login-btn" id="loginBtn">Log in</button>
        <button type="button" class="link-btn" id="backToEmailFromLogin">Use a different email</button>
      </form>

      <!-- Sign up form (first-time user) -->
      <form id="signupForm" class="login-form" data-step="signup">
        <div class="input-group">
          <label for="signupEmail">Email</label>
          <input type="email" id="signupEmail" name="signupEmail" placeholder="you@example.com" autocomplete="email" readonly>
        </div>
        <div class="input-group">
          <label for="signupPassword">Password</label>
          <input type="password" id="signupPassword" name="signupPassword" placeholder="Create a password" autocomplete="new-password" required>
        </div>
        <div class="input-group">
          <label for="signupConfirm">Confirm Password</label>
          <input type="password" id="signupConfirm" name="signupConfirm" placeholder="Confirm your password" autocomplete="new-password" required>
        </div>
        <button type="submit" class="login-btn" id="signupBtn">Create account</button>
        <button type="button" class="link-btn" id="backToEmailFromSignup">Use a different email</button>
      </form>

      <p class="login-footer">Secure access · Use your credentials</p>
    </div>
  </main>

  <script src="js/login.js"></script>
</body>
</html>
